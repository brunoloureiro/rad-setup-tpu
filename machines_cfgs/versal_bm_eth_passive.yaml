# Configuration for the Versal Bare-Metal DUT, passive mode, reached over Ethernet.
#
# dut_mode is "passive": this board has no OS/shell. Its app starts running automatically as soon
# as it is (re)loaded via 'redeploy_cmd' below (an xsct/JTAG-debugger deployment script), instead
# of being started by logging into a console and issuing kill/run commands. Deployment/reload
# always goes over the JTAG debug probe (see redeploy_cmd) regardless of this DUT's network
# reachability; "ethernet-based" here refers to this DUT's management/log-facing IP.

# the IP address of the machine
ip: 192.168.0.24

# Port that the device will send data
receive_port: !!int 1024

# hostname the hostname of the machine, that must contains the device in the name
hostname: versal_bm_ethernet

# username / password: omitted - unused, since dut_mode is "passive" and no console login is ever
# performed for this DUT (see server/machine.py).

# power_switch_ip IP address of the power switch
power_switch_ip: 192.168.0.100

# power_switch_port outlet of the power switch
power_switch_port: !!int 1

# power_switch_model brand of the power switch
power_switch_model: lindy

# The server will wait for this time for the OS booting
# In seconds
boot_waiting_time: !!int 60

# connection timeout
# This is the maximum time interval between the messages received
max_timeout_time: !!int 5

# Disable the option for OS soft reboot before trying to hard reboot
# (dut_mode: passive forces this to True automatically anyway, since there is no OS to reboot)
disable_os_soft_reboot: !!bool True

# connection_type: transport used to log into the DUT console and issue commands.
# Supported values: "telnet" (default, used if omitted) or "jtag".
connection_type: telnet

# jtag_port / jtag_baudrate: only used when connection_type is "jtag". jtag_port is the serial
# device exposed by the JTAG probe's UART bridge (e.g. an FTDI-based adapter), jtag_baudrate
# defaults to 115200 if omitted.
# connection_type: jtag
# jtag_port: /dev/ttyUSB0
# jtag_baudrate: !!int 115200

# dut_mode: how the app is (re)started on this DUT.
# - "active" (default, used if omitted): an OS-enabled DUT reachable over a console
#   (connection_type telnet/jtag); the app is (re)started by logging in and issuing kill/run
#   commands.
# - "passive": a bare-metal DUT (e.g. FPGA/SoC) with no OS/shell, whose app runs automatically
#   as soon as it is (re)loaded. Instead of console commands, the app is (re)started by running
#   'redeploy_cmd' below (soft OS reboot is automatically disabled in this mode, as there is no
#   OS to reboot).
dut_mode: passive

# redeploy_cmd: required when dut_mode is "passive". Command used to (re)load and start the app,
# e.g. a TCL script driven through a JTAG debugger (Xilinx xsct/xsdb). Either a shell-style
# string or a YAML list (list form avoids shell quoting/injection concerns and is preferred).
#
# deploy.tcl requires PDI_PATH (and optionally ELF_PATH) to be set in the child process
# environment; these are set here via the 'env' utility rather than a shell, so no shell
# invocation/quoting is involved.
redeploy_cmd: [
    "env",
    "PDI_PATH=/home/loureiro/repos/radiation-setup-jtag/machines_cfgs/versal_files/versal_bm_eth.pdi",
    "ELF_PATH=/home/loureiro/repos/radiation-setup-jtag/machines_cfgs/versal_files/versal_bm_eth.elf",
    "xsct",
    "/home/loureiro/repos/radiation-setup-jtag/machines_cfgs/versal_scripts/deploy.tcl",
]

# redeploy_timeout: max seconds to wait for redeploy_cmd to finish. Defaults to 60 if omitted.
redeploy_timeout: !!int 15

# restart_interval: seconds to wait between receiving '#ABORT'/'#END' from the DUT and
# restarting its app. Defaults to 1.0 if omitted.
# restart_interval: !!float 1.0

# json_files: not used here - no benchmark rotation is needed, and this DUT has no console to
# issue exec/killcmd on anyway. Since dut_mode is "passive" and json_files is omitted, test_name
# (required) and test_header (optional) below are used instead to name DUTLogging files.
test_name: versal_bm_ethernet
test_header: Versal Bare-Metal DUT, passive mode, over Ethernet
