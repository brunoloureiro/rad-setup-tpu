# Configuration example for an OS-enabled Versal DUT with no network path to a console (e.g. an
# isolated bring-up board on the bench), logged into over a JTAG probe's serial/UART bridge instead
# of Telnet.
#
# dut_mode is "active" (default): this board runs an OS/shell, so the app is (re)started by
# logging in and issuing kill/run commands from json_files below, exactly like a Telnet-based
# active DUT - only the console transport differs.
#
# console_type is "jtag": there is no network route to this DUT's console, so the server logs in
# over console_jtag_port below (the JTAG probe's serial/UART bridge) instead of dialing an IP over
# Telnet. 'ip' is therefore omitted; 'username'/'password' are still required, same as any other
# dut_mode "active" DUT.
#
# connection_type is "ethernet" here: this board's network stack still works even though its
# console doesn't have a reachable path, so DUT status/log messages (#IT, #LOGFILE, #CMD, ...) are
# still received over the usual UDP socket. console_type and connection_type are fully
# independent - contrast with machines_cfgs/versal_bm_jtag_passive.yaml, which uses JTAG for
# message listening on a dut_mode "passive" (no console at all) board.

# hostname the hostname of the machine, that must contains the device in the name
hostname: versal_active_jtag_console

# Port that the device will send data. Required because connection_type is "ethernet" below.
receive_port: 1024

# username / password: required for dut_mode "active" regardless of console_type.
username: carol
password: qwerty0

# power_switch_ip IP address of the power switch
power_switch_ip: 192.168.0.100

# power_switch_port outlet of the power switch
power_switch_port: !!int 1

# power_switch_model brand of the power switch
power_switch_model: lindy

# The server will wait for this time for the OS booting
# In seconds
boot_waiting_time: !!int 60

# connection timeout
# This is the maximum time interval between the messages received
max_timeout_time: !!int 10

# Disable the option for OS soft reboot before trying to hard reboot
disable_os_soft_reboot: !!bool True

# console_type: "jtag" instead of the default "telnet" - see header comment above.
console_type: jtag

# console_jtag_port / console_jtag_baudrate: the serial device exposed by the JTAG probe's UART
# bridge that the server logs into. Kept separate from connection_type's jtag_port (unused here,
# since connection_type is "ethernet" below) since the two can be different serial devices.
console_jtag_port: /dev/ttyUSB2
# console_jtag_baudrate: !!int 115200   # optional, defaults to 115200

# connection_type: "ethernet" - this board's network stack works fine, only its console doesn't
# have a reachable path. See machines_cfgs/versal_bm_jtag_passive.yaml for a board where messages
# also have to go over JTAG.
connection_type: ethernet

# Json files that contain the commands (required for dut_mode "active")
json_files: [
    "machines_cfgs/dummy.json",
]
