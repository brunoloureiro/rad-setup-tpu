# Configuration example for carolk401 device
#
# Three independent axes configure this DUT:
# - dut_mode ("active"/"passive" below): how the app is (re)started - console kill/run commands,
#   or a local redeploy_cmd script.
# - console_type ("telnet"/"jtag" below): only meaningful when dut_mode is "active" - which
#   transport the console (kill/run commands, boot-time login check) uses.
# - connection_type ("ethernet"/"jtag" below): how the server listens for DUT status/log messages
#   (#IT, #LOGFILE, #CMD, ...) - a UDP socket, or the JTAG probe's serial/UART bridge.
# Any combination is valid; this example is active+telnet+ethernet, the original/default mode.

# the IP address of the machine
# Required when dut_mode is "active" (the default - see below) and console_type is "telnet" (also
# the default): the Telnet console dials this address directly, and it is also pinged during the
# boot-time readiness check. Optional/unused when dut_mode is "passive" (no console is ever logged
# into) or when console_type is "jtag" (see below - a JTAG console has no IP to dial/ping).
ip:  192.168.195.6

# Port that the device will send data
# Required when connection_type is "ethernet" (the default - see below): the DUT's libLogHelper
# config and this server both need to agree on a fixed, known-in-advance port, so it cannot be
# left to an OS-assigned ephemeral one. Unused when connection_type is "jtag".
receive_port: 1024

# hostname the hostname of the machine, that must contains the device in the name
hostname: caroldummy

# username
# Required when dut_mode is "active" (the default - see below), since a console login is
# performed. Optional/unused when dut_mode is "passive" (no console is ever logged into) -
# defaults to 'hostname' above when omitted in that case.
username: carol

# password of the device
# Same requirement as 'username' above: only needed for dut_mode "active".
password: qwerty0

# power_switch_ip IP address of the power switch
power_switch_ip: 192.168.1.100

# power_switch_port outlet of the power switch
power_switch_port: !!int 1

# power_switch_model brand of the power switch
power_switch_model: lindy

# The server will wait for this time for the OS booting (dut_mode "active" only - see below;
# ignored for "passive" DUTs, which redeploy immediately instead of waiting)
# In seconds
boot_waiting_time: !!int 60

# connection timeout
# This is the maximum time interval between the messages received
max_timeout_time: !!int 10

# Disable the option for OS soft reboot before trying to hard reboot
disable_os_soft_reboot: !!bool True

# connection_type: how the server listens for DUT status/log messages (#IT, #LOGFILE, #CMD, ...).
# Supported values: "ethernet" (default, used if omitted) - a UDP socket bound to
# server_ip:receive_port, or "jtag" - the JTAG probe's serial/UART bridge (jtag_port/jtag_baudrate
# below). Independent of both dut_mode and console_type below - e.g. this DUT could use a JTAG
# console (console_type: jtag) while still reporting status over this UDP socket.
connection_type: ethernet

# jtag_port / jtag_id / jtag_baudrate: only used when connection_type is "jtag". jtag_port is the
# literal serial device exposed by the JTAG probe's UART bridge (e.g. an FTDI-based adapter) that
# the server reads DUT messages from; jtag_baudrate defaults to 115200 if omitted.
#
# jtag_port is not stable across reboots/re-enumerations (a probe unplugged/replugged, or two
# probes enumerated in a different order, can move to a different /dev/ttyUSB<n>). jtag_id is a
# stable alternative: the JTAG probe's own USB serial number (the same value as
# 'jtag_cable_serial'/BOARD_SERIAL in machines_cfgs/versal_scripts/board_select.tcl), which the
# server resolves to whatever device path it currently is every time it (re)opens the port (see
# server/jtag_port.py). If both are set, jtag_id takes precedence.
# connection_type: jtag
# jtag_port: /dev/ttyUSB0
# jtag_id: 25163300A1A7A
# jtag_baudrate: !!int 115200

# jtag_raw_log: mirrors every raw byte read off the connection_type "jtag" serial port to this
# file (see server/serial_tee.py) - useful because only one process can reliably read a given
# serial device at a time, so a human `tail -f`-ing the raw traffic directly off /dev/ttyUSB<n>
# alongside this server would corrupt both views. Defaults to a file under a 'jtag_logs/<hostname>/'
# directory that is a SIBLING of server_log_store_dir (e.g. if server_log_store_dir is 'logs/',
# this defaults under './jtag_logs/'), deliberately NOT nested inside logs/<hostname>/ alongside
# DUTLogging's application/test-run logs; set to null/"" to disable.
# jtag_raw_log: /home/user/jtag_logs/caroldummy/jtag_raw.log

# console_type: only meaningful when dut_mode is "active" below (a "passive" DUT never opens a
# console). Supported values: "telnet" (default, used if omitted) - a network Telnet connection to
# 'ip' above, or "jtag" - a JTAG probe's serial/UART bridge (console_jtag_port/console_jtag_baudrate
# below), for DUTs with no network path to a console at all. Independent of connection_type above -
# console_jtag_port and jtag_port may be the same or different serial devices.
# console_type: jtag

# console_jtag_port / console_jtag_id / console_jtag_baudrate: only used when console_type is
# "jtag". console_jtag_port is the literal serial device exposed by the JTAG probe's UART bridge
# that the server logs into (kept separate from connection_type's jtag_port above, since they may
# be different devices); console_jtag_baudrate defaults to 115200 if omitted. 'ip' above is not
# needed in this case, but 'username'/'password' below still are. console_jtag_id is the same
# stable-across-reboots alternative to a literal port described for jtag_id above, applied to the
# console instead of the message channel; if both are set, console_jtag_id takes precedence.
# console_jtag_port: /dev/ttyUSB2
# console_jtag_id: 25163300A1A7A
# console_jtag_baudrate: !!int 115200

# console_jtag_raw_log: same idea as jtag_raw_log above, but for the console_type "jtag" serial
# port. Defaults under the same 'jtag_logs/<hostname>/' sibling directory as jtag_raw_log above
# (different filename: jtag_console.log); set to null/"" to disable.
# console_jtag_raw_log: /home/user/jtag_logs/caroldummy/jtag_console.log

# dut_mode: how the app is (re)started on this DUT.
# - "active" (default, used if omitted): an OS-enabled DUT reachable over a console (Telnet or
#   JTAG, per console_type above); the app is (re)started by logging in and issuing kill/run
#   commands (from json_files below).
# - "passive": a bare-metal DUT (e.g. FPGA/SoC) with no OS/shell, whose app runs automatically
#   as soon as it is (re)loaded. Instead of console commands, the app is (re)started by running
#   'redeploy_cmd' below (soft OS reboot is automatically disabled in this mode, as there is no
#   OS to reboot).
# dut_mode: passive

# redeploy_cmd: required when dut_mode is "passive". Command used to (re)load and start the app,
# e.g. a TCL script driven through a JTAG debugger (Xilinx xsct/xsdb). Either a shell-style
# string or a YAML list (list form avoids shell quoting/injection concerns and is preferred).
# Run immediately (no boot_waiting_time wait) as soon as the DUT is powered on.
# redeploy_cmd: ["xsct", "/home/user/scripts/deploy.tcl"]

# redeploy_timeout: max seconds to wait for redeploy_cmd to finish. Defaults to 60 if omitted.
# redeploy_timeout: !!int 60

# restart_interval: seconds to wait between receiving '#ABORT'/'#END' from the DUT and
# restarting its app. Defaults to 1.0 if omitted.
# restart_interval: !!float 1.0

# Json files that contain the commands
# Required when dut_mode is "active" (supplies the console kill/run commands). Optional when
# dut_mode is "passive": if omitted there, 'test_name' (required) / 'test_header' (optional,
# defaults to "") below are used instead to name DUTLogging files, and the command_window
# rotation/timeout is skipped entirely (there are no benchmarks to rotate between).
json_files: [
#  "/home/fernando/git_research/radiation-setup/machines_cfgs/cuda_micro.json",
    "/home/fernando/git_research/radiation-setup/machines_cfgs/dummy.json",
]

# test_name / test_header: only used (and 'test_name' required) when dut_mode is "passive" and
# 'json_files' is omitted - see above.
# test_name: versal_bm
# test_header: Versal Bare-Metal passive DUT, no json_files configured
